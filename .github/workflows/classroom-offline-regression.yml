name: Classroom offline regression
on:
  push:
    branches:
      - 'test/**'
      - 'dev/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run service worker regression
        run: |
          node tests/sw-regression.test.cjs
          node tests/board-admission.test.cjs
          node tests/board-admission-behavior.test.cjs
