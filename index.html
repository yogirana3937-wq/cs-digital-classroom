<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CS Classroom</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:system-ui,sans-serif}header{padding:16px;background:#050b14;border-bottom:2px solid #38506d}header h1{margin:0;color:#38bdf8;font-size:clamp(1.2rem,3vw,2rem)}.wrap{max-width:1400px;margin:auto;padding:18px}.card{background:#101d30;border:2px solid #38506d;border-radius:16px;padding:18px;margin-bottom:16px}button,input{font:inherit}button{padding:12px 16px;min-height:48px;border:2px solid #38506d;border-radius:10px;background:#15243a;color:white;font-weight:800;cursor:pointer}.primary{background:#38bdf8;color:#06111c;border-color:#38bdf8}.green{background:#4ade80;color:#06110c;border-color:#4ade80}input{padding:14px;width:100%;max-width:400px;border:2px solid #38506d;border-radius:10px;background:#07111f;color:white;font-size:1.4rem;letter-spacing:5px;text-align:center}.role{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}.title{color:#38bdf8;font-size:clamp(1.8rem,4vw,3rem);font-weight:900}p{font-size:clamp(1rem,1.7vw,1.3rem);line-height:1.6;color:#d7e1ed}.status{font-weight:900;color:#fbbf24}.ok{color:#4ade80}.nav{display:flex;gap:8px;overflow:auto;padding:10px;background:#101d30;border-bottom:2px solid #38506d}.nav button{white-space:nowrap}.active{background:#38bdf8;color:#06111c}.controls{display:flex;gap:10px;flex-wrap:wrap}.images{display:grid;grid-template-columns:1fr 1fr;gap:12px}.images img{width:100%;border:2px solid #38506d;border-radius:12px}.section{border-left:4px solid #38bdf8;padding:10px 15px;margin:14px 0;background:#0c1726;border-radius:8px}.section h3{color:#4ade80;margin:0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fact{padding:13px;border:2px solid #fbbf24;border-radius:10px;background:#15243a}.fact b{color:#fbbf24}.board .title{font-size:clamp(2rem,5vw,4.5rem)}.board p{font-size:clamp(1.15rem,2.2vw,1.9rem)}.full{position:fixed;right:15px;top:15px;z-index:5}@media(max-width:800px){.images,.facts{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>📚 CS Digital Classroom</h1></header>
<div id="setup" class="wrap">
<div class="card"><h2>Choose device</h2><div class="role">
<button class="primary" onclick="teacher()">👩‍🏫 Teacher Phone</button>
<button class="green" onclick="board()">🖥️ Digital Board</button></div></div>
<div id="teacherBox" class="card hidden"><h2>Teacher</h2><p>Choose a simple 6-digit classroom code and start the room.</p>
<input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><br><br>
<button class="primary" onclick="startTeacher()">Start Classroom</button><p id="ts" class="status"></p></div>
<div id="boardBox" class="card hidden"><h2>Digital Board</h2><p>Enter the 6-digit code shown/selected by the teacher. You only need to do this when starting a class.</p>
<input id="bcode" inputmode="numeric" maxlength="6" placeholder="123456"><br><br>
<button class="green" onclick="startBoard()">Connect to Teacher</button><p id="bs" class="status"></p></div>
</div>
<div id="app" class="hidden">
<button class="primary full" onclick="fs()">⛶ Full Screen</button><nav id="nav" class="nav"></nav>
<main class="wrap"><div class="card"><div id="live" class="status"></div><div id="title" class="title"></div><p id="overview"></p><div id="controls" class="controls"></div></div>
<div class="card"><h2>🖼️ Teaching Visuals</h2><div class="images"><img id="img1"><img id="img2"></div></div>
<div class="card"><h2>📚 Detailed Explanation</h2><div id="sections"></div></div>
<div class="card"><h2>💡 Topic Facts</h2><div id="facts" class="facts"></div></div></main></div>
<script>
const L=[{"title": "1. Computer Characteristics & Components", "overview": "Computers accept input, process information, produce output and store data. Hardware is the physical equipment; software is the instructions and data that make the equipment useful.", "facts": ["CPU executes instructions and coordinates many operations.", "RAM is temporary working memory; storage keeps data when power is removed.", "Input, process, output and storage form a useful introductory model for understanding computer systems."], "sections": [["Core idea", "A computer is a programmable electronic system. It can perform arithmetic, logical operations, comparisons, data movement and communication according to instructions."], ["IPOS cycle", "Input supplies data through keyboards, cameras, microphones, sensors and touchscreens. Processing transforms data. Output communicates results through screens, speakers, printers or actuators. Storage retains information."], ["CPU, RAM and storage", "The CPU executes instructions. RAM provides fast working space for active programs. SSDs and hard drives provide persistent storage. They have different purposes and should not be described as interchangeable."], ["Motherboard and buses", "The motherboard provides physical and electrical connections between major components. Buses and interfaces provide pathways for data and control signals."], ["GPU", "A graphics processing unit is designed for highly parallel operations and is widely used for graphics, visualization and some general-purpose workloads."], ["Input/output devices", "Keyboard, mouse, camera, microphone and sensors are common input devices. Display, speakers and printers are common output devices. Touchscreens can perform both roles."], ["Hardware vs software", "Hardware can be physically touched. Software includes operating systems, applications, drivers and other instructions. Hardware needs software to perform useful tasks."], ["Computer characteristics", "Speed, accuracy, automation, storage, consistency, versatility and connectivity are common characteristics. These are strengths only when the system is correctly designed and supplied with suitable data."], ["Classroom activity", "Ask students to trace a school attendance system through input, processing, output and storage. Then ask them to identify which parts are hardware and which are software."]], "image1": "images/topic1_1.svg", "image2": "images/topic1_2.svg"}, {"title": "2. History of Computing & Evolution", "overview": "Computing developed through many overlapping inventions: manual calculation tools, mechanical devices, electronic components, integrated circuits, microprocessors, personal computers, networks, mobile devices and cloud systems.", "facts": ["The abacus is an early structured calculation aid.", "Transistors replaced vacuum tubes in many systems because they were smaller, more reliable and more efficient.", "The microprocessor placed CPU functionality on a chip and helped enable widespread personal computing."], "sections": [["Early tools", "Tally marks, counting boards and the abacus provided ways to represent quantities and support calculation."], ["Mechanical calculators", "Gear-based machines automated arithmetic. They helped demonstrate that mechanical systems could carry out repeatable calculations."], ["Babbage and Lovelace", "Charles Babbage proposed programmable mechanical machines. Ada Lovelace's notes on the Analytical Engine included an algorithm and are historically significant."], ["Vacuum tubes", "Early electronic computers used vacuum tubes for switching and amplification. They were large and produced substantial heat."], ["Transistors", "Transistors provided smaller and generally more reliable electronic switching, enabling more compact systems."], ["Integrated circuits", "Integrated circuits put multiple electronic components onto chips, improving size, reliability and manufacturing efficiency."], ["Microprocessors", "A microprocessor integrates CPU functions onto a chip. This was a major step toward affordable personal computers and embedded systems."], ["Personal computers", "Personal computers brought interactive computing into homes, schools and offices. Graphical interfaces and peripherals improved usability."], ["Internet, web and mobile", "Networking connected systems. The web made linked information accessible through browsers. Smartphones combined computing, communication, cameras, sensors and applications."], ["Classroom timeline", "Give groups technology cards and ask them to arrange a timeline. Emphasize that technologies overlapped rather than replacing each other overnight."]], "image1": "images/topic2_1.svg", "image2": "images/topic2_2.svg"}, {"title": "3. Word Processing", "overview": "Word processors support creation, editing, formatting, organization, saving and sharing of documents. Good document design emphasizes structure and readability.", "facts": ["Ctrl+S commonly saves a document in many desktop applications.", "Styles help maintain consistent headings and can support automatic tables of contents.", "Spell checking is useful but does not replace proofreading or fact checking."], "sections": [["Document creation", "Start with the purpose, audience and structure. Use meaningful filenames and save early."], ["Editing", "Select, copy, cut, paste, undo, redo, find and replace are core editing operations."], ["Formatting", "Character formatting changes fonts and emphasis. Paragraph formatting controls alignment, indentation, spacing, bullets and numbering."], ["Styles and headings", "Heading styles create a meaningful hierarchy. They are better than manually enlarging every heading because document tools can use the hierarchy for navigation."], ["Tables", "Tables organize related values in rows and columns. Good table design uses clear headings and avoids unnecessary decoration."], ["Images", "Images can clarify concepts, but should be relevant and appropriately sized. Captions and alternative text can improve accessibility."], ["Page layout", "Margins, page size, orientation, headers, footers and page numbers affect printed and digital presentation."], ["Proofreading", "Check spelling, grammar, meaning, facts, formatting and source attribution. Automated checking cannot detect every problem."], ["Responsible use", "Students should respect copyright, cite sources when required and distinguish their own work from copied material."], ["Classroom activity", "Give students a plain page and ask them to turn it into a structured assignment with a title, headings, bullets, table and page number."]], "image1": "images/topic3_1.svg", "image2": "images/topic3_2.svg"}, {"title": "4. PowerPoint Presentations", "overview": "Presentation software combines slides, text, images, diagrams, charts, audio, video and animation to support spoken communication.", "facts": ["A slide should usually communicate one main idea.", "Speaker notes can contain supporting details without crowding the slide.", "Animation is most useful when it reveals a process or focuses attention."], "sections": [["Planning", "Identify audience, learning goal and sequence before choosing a theme."], ["Slide hierarchy", "Titles and headings should make the structure obvious. Avoid filling slides with long paragraphs."], ["Visuals", "Use diagrams for relationships and processes, and charts for numerical patterns. Label important elements."], ["Transitions", "Transitions affect movement between slides. Use them consistently and sparingly."], ["Animations", "Animations can reveal steps, but excessive movement can distract learners."], ["Speaker notes", "Notes help the teacher remember examples, explanations and prompts without placing all text on the screen."], ["Accessibility", "Use readable text, good contrast, captions where appropriate and descriptions for important visual content."], ["Citations", "Images, statistics and quotations may require attribution depending on their source and intended use."], ["Delivery", "Maintain eye contact, explain rather than read, pause for questions and check whether students are following."], ["Classroom activity", "Turn a textbook paragraph into three slides: key idea, visual explanation and summary. Ask students whether the slides improve understanding."]], "image1": "images/topic4_1.svg", "image2": "images/topic4_2.svg"}, {"title": "5. Excel Spreadsheets", "overview": "Spreadsheets organize structured data and calculate results with formulas and functions. They are useful for marks, budgets, inventories, surveys and schedules.", "facts": ["A1 means column A, row 1 in common spreadsheet notation.", "SUM adds values and AVERAGE calculates their arithmetic mean.", "Relative and absolute references behave differently when formulas are copied."], "sections": [["Workbook and worksheet", "A workbook is the file; a worksheet is a sheet inside it. Cells are intersections of rows and columns."], ["Cell references", "A1 identifies a cell. References allow formulas to use values stored elsewhere."], ["Formulas", "Formulas commonly start with = and can use arithmetic operators and parentheses."], ["Functions", "SUM, AVERAGE, MIN, MAX and COUNT are common functions. More advanced functions support logical tests, lookups and text processing."], ["Relative references", "A relative reference changes when a formula is copied to another location."], ["Absolute references", "A reference such as $A$1 can remain fixed when a formula is copied, depending on the spreadsheet software."], ["Charts", "Column/bar charts compare categories; line charts show change over time; other charts suit different questions."], ["Sort and filter", "Sorting changes order; filtering displays matching rows while leaving other data available."], ["Errors", "Check formulas, references, units and assumptions. Compare with manual calculations when practical."], ["Classroom activity", "Build a marks sheet, calculate totals and averages, then create a chart. Change one mark and observe which results update."]], "image1": "images/topic5_1.svg", "image2": "images/topic5_2.svg"}, {"title": "6. Web Architecture", "overview": "The web uses browsers, servers, networks and web technologies to exchange documents and data. HTML provides structure, CSS presentation, and JavaScript behavior.", "facts": ["A browser is a common web client.", "HTTPS uses HTTP over a secure encrypted connection using TLS.", "A single webpage can trigger many requests for scripts, images, fonts, styles and data."], "sections": [["Client and server", "A client requests a service. A server receives requests and returns resources or generated responses."], ["URL and domain", "A URL identifies a resource. Domain names provide human-friendly names that can be resolved to network addresses."], ["HTTP and HTTPS", "HTTP defines web message exchange. HTTPS adds encrypted transport through TLS. Encryption does not automatically mean that a site is trustworthy."], ["HTML, CSS and JavaScript", "HTML structures content, CSS controls presentation, and JavaScript adds behavior and interactivity."], ["Request and response", "A browser can request HTML and then additional resources. Responses contain status information and content."], ["DNS", "The Domain Name System resolves domain names to network addresses and may use cached results."], ["Cookies and sessions", "Cookies can store preferences or session identifiers. Their use has privacy and security implications."], ["Web security", "Secure authentication, input validation, access control and safe data handling are important. Students should only test systems they are authorized to test."], ["Local web apps", "A local server can serve an HTML project over HTTP, avoiding some restrictions associated with directly opening local files."], ["Classroom analogy", "Compare a web interaction with a restaurant: browser = customer, request = order, server = kitchen, response = completed order."]], "image1": "images/topic6_1.svg", "image2": "images/topic6_2.svg"}, {"title": "7. Binary Logic & Number System", "overview": "Binary is the base-2 number system. Computers use bits with two states, commonly represented as 0 and 1, to represent digital information.", "facts": ["One byte is commonly eight bits.", "Eight bits can form 256 different patterns.", "Binary 101 is decimal 5 because 1×4 + 0×2 + 1×1 = 5."], "sections": [["Bits and bytes", "A bit has two possible states. Eight bits make a byte. With n bits, there are 2^n possible patterns."], ["Place values", "Binary places represent powers of two: 1, 2, 4, 8, 16, 32 and so on."], ["Binary to decimal", "Multiply each bit by its place value and add the results."], ["Decimal to binary", "Select powers of two that add to the target number or repeatedly divide by two."], ["Logic gates", "AND, OR and NOT are foundational gates. NAND and NOR are also important in digital logic."], ["Data representation", "Binary patterns can represent numbers, characters, colors, instructions and many other forms depending on the encoding."], ["Signed values", "Systems use methods such as two's complement to represent negative integers."], ["Overflow", "A fixed number of bits limits the range of values. Values outside the range can overflow or be represented differently."], ["Interactive teaching", "Use physical cards labeled 128, 64, 32, 16, 8, 4, 2 and 1. Face up means 1 and face down means 0."], ["Classroom challenge", "Ask students to build a target number using the fewest cards and then explain their method."]], "image1": "images/topic7_1.svg", "image2": "images/topic7_2.svg"}, {"title": "8. Computer Network Topology", "overview": "A network connects devices so they can exchange information. Topology describes how connections are arranged physically or logically.", "facts": ["Star networks commonly use a central switch.", "Mesh topologies provide multiple paths but require more links.", "Real networks often combine several topology ideas rather than using one pure form."], "sections": [["Network devices", "Common devices include switches, routers, wireless access points, endpoints and servers."], ["Star", "Endpoints connect to a central switch or device. A single endpoint link can fail without necessarily stopping other endpoints."], ["Bus", "Devices share a common communication path. It is useful historically for teaching topology."], ["Ring", "Devices form a loop. Protocols determine how data moves around the ring."], ["Mesh", "Multiple connections create alternate paths. Full mesh connects every pair, while partial mesh connects selected devices."], ["Tree", "Hierarchical branches form a tree-like arrangement."], ["Switch vs router", "A switch connects devices within a network and forwards frames. A router connects different networks and forwards packets between them."], ["Performance", "Design considers bandwidth, latency, reliability, scalability, cost and security."], ["Fault tolerance", "Redundant paths can improve resilience but add cost and management complexity."], ["Classroom activity", "Use string or cables to build star, ring and mesh arrangements, then remove one link and discuss the effect."]], "image1": "images/topic8_1.svg", "image2": "images/topic8_2.svg"}, {"title": "9. Programming Languages & Compilers", "overview": "Programming languages allow humans to express algorithms. Translators such as compilers and interpreters convert or execute those instructions in forms the computer can use.", "facts": ["An algorithm is a solution method; source code is an implementation of that method.", "Syntax errors violate grammar; logic errors can occur even when a program runs.", "Compilers can perform stages such as parsing, semantic analysis, optimization and code generation."], "sections": [["Algorithms", "Start with the problem and solution steps before focusing on language syntax."], ["Language levels", "Machine code is directly executable by a processor. Assembly uses symbolic instructions. High-level languages provide more abstraction."], ["Compiler", "A compiler translates source code into another representation, often including machine code, object code or intermediate code."], ["Interpreter", "An interpreter evaluates or executes program representations at runtime. Modern systems may combine compilation and interpretation."], ["Syntax", "Syntax defines the grammar of a programming language."], ["Semantics", "Semantics concerns what valid code means and how it behaves."], ["Build process", "Depending on the language, a build may involve preprocessing, compilation, assembly, linking and packaging."], ["Errors", "Syntax errors stop or disrupt translation. Runtime errors occur during execution. Logic errors produce incorrect results."], ["Testing and debugging", "Reproduce the issue, isolate the cause, make a small change, test again and document the result."], ["Classroom activity", "Write the algorithm for rectangle area in plain language, pseudocode and a programming language. Compare the algorithm with the syntax."]], "image1": "images/topic9_1.svg", "image2": "images/topic9_2.svg"}, {"title": "10. Machine Learning & Artificial Intelligence", "overview": "Artificial intelligence is a broad field. Machine learning is a major approach in which algorithms learn patterns from data and use them to make predictions or decisions.", "facts": ["Training data influences what a model learns.", "Overfitting occurs when a model fits training examples too closely and performs poorly on new data.", "Accuracy is not always sufficient; the evaluation metric should match the task."], "sections": [["AI and ML", "AI is broader than machine learning. Machine learning focuses on learning patterns from data."], ["Training data", "Training examples are used to fit model parameters. In supervised learning, examples usually include labels or target values."], ["Validation and testing", "Validation data can help select or tune models. Test data is held back for final evaluation."], ["Supervised learning", "Classification predicts categories; regression predicts numerical values."], ["Unsupervised learning", "Clustering and dimensionality reduction can discover structure without target labels."], ["Neural networks", "Neural networks use layers of computational units and adjustable parameters. Deep learning uses many layers."], ["Overfitting", "A model may memorize training patterns or noise instead of learning general patterns."], ["Evaluation", "Depending on the problem, useful measures include precision, recall, F1 score, accuracy, mean absolute error and mean squared error."], ["Responsible AI", "Bias, privacy, errors, security and unequal impacts need careful consideration. Human oversight remains important."], ["Classroom activity", "Use a small labeled dataset such as fruit properties. Ask students to classify a new example and discuss why diverse training data matters."]], "image1": "images/topic10_1.svg", "image2": "images/topic10_2.svg"}];let mode="",lesson=0,peer=null,conn=null,code="";
const $=x=>document.getElementById(x);
function teacher(){$("teacherBox").classList.remove("hidden");$("boardBox").classList.add("hidden")}
function board(){$("boardBox").classList.remove("hidden");$("teacherBox").classList.add("hidden")}
function safeCode(v){return /^\d{6}$/.test(v)?v:null}
function startTeacher(){
 code=safeCode($("code").value);if(!code){$("ts").textContent="● Enter exactly 6 digits";return}
 peer=new Peer("cs-class-"+code);
 peer.on("open",()=>{$("ts").textContent="● Classroom ready — waiting for board";openApp()});
 peer.on("connection",c=>{conn=c;conn.on("open",()=>{$("ts").textContent="● Digital board connected";send()})});
 peer.on("error",e=>$("ts").textContent="● "+e.type+" — code may already be in use");
}
function startBoard(){
 code=safeCode($("bcode").value);if(!code){$("bs").textContent="● Enter exactly 6 digits";return}
 $("bs").textContent="● Connecting…";peer=new Peer();
 peer.on("open",()=>{conn=peer.connect("cs-class-"+code);conn.on("open",()=>{$("bs").textContent="● Connected";openApp()});conn.on("data",m=>{if(m.type==="lesson"){lesson=m.lesson;render(lesson)}});conn.on("close",()=>$("live").textContent="● Teacher disconnected")})
 peer.on("error",e=>$("bs").textContent="● "+e.type);
}
function send(){if(conn&&conn.open)conn.send({type:"lesson",lesson})}
function go(n){lesson=(n+L.length)%L.length;render(lesson);send()}
function render(i){let x=L[i];$("title").textContent=x.title;$("overview").textContent=x.overview;$("img1").src=x.image1;$("img2").src=x.image2;
$("sections").innerHTML=x.sections.map(s=>`<div class="section"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");
$("facts").innerHTML=x.facts.map((f,j)=>`<div class="fact"><b>Fact ${j+1}</b><p>${f}</p></div>`).join("");
$("nav").innerHTML=L.map((q,j)=>`<button class="${j===i?"active":""}" onclick="${mode==="teacher"?`go(${j})`:"return false"}">${j+1}. ${q.title.split(" ").slice(0,3).join(" ")}</button>`).join("")}
function openApp(){$("setup").classList.add("hidden");$("app").classList.remove("hidden");mode=mode||"board";$("controls").innerHTML=mode==="teacher"?`<button class="primary" onclick="go(lesson-1)">← Previous</button><button class="primary" onclick="go(lesson+1)">Next →</button>`:"";$("live").textContent=mode==="teacher"?"● TEACHER CONTROL":"● LIVE — Teacher controlled";render(lesson)}
function fs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}
</script></body></html>
