function networkView(failed){
 const down=label=>`<span class="network-node ${failed===label?'network-down':''}">${label}</span>`;
 const edge=(ok)=>`<span class="network-edge ${ok?'':'network-down'}">${ok?'━━':'╳╳'}</span>`;
 const a=failed!=='Switch'&&failed!=='One PC link',b=failed!=='Switch',wan=failed!=='Switch'&&failed!=='Router';
 return `<div class="network-demo" role="img" aria-label="PC A ${a?'connected':'disconnected'} to switch; PC B ${b?'connected':'disconnected'} to switch; Internet ${wan?'reachable':'unreachable'}"><div>${down('PC A')}${edge(a)}${down('Switch')}${edge(wan)}${down('Router')}${edge(wan)}${down('Internet')}</div><div>${down('PC B')}${edge(b)}<span class="network-node">Switch</span></div><small>PC A ↔ PC B: ${a&&b?'connected':'disconnected'} · Internet: ${wan?'reachable':'unreachable'}</small></div>`
}
const ACTIVITIES=[
 {question:'If six apps are open but the classroom computer has space for four active apps, what happens?',choices:['Everything stays in RAM','Some work must be moved or apps slowed','The SSD becomes the CPU'],correct:1,why:'RAM is limited working space. When active work exceeds it, the system may move some data to slower storage, which can reduce responsiveness.',challenge:'Why would saving a document to an SSD still matter after closing every app?',control:'Open apps',min:1,max:8,start:3,unit:'apps',compute:v=>({label:v<=4?'Fits in RAM':'Exceeds RAM capacity',detail:v<=4?`${v} active app${v===1?'':'s'} fit in this model’s four slots.`:`${v} apps need ${v-4} more slots than this model has. The operating system must manage the shortage.`,view:`RAM slots: ${'●'.repeat(Math.min(v,4))}${'○'.repeat(4-Math.min(v,4))}  ${v>4?'→ overflow: '+(v-4):''}`})},
 {question:'Which change made computers much smaller and more energy efficient than vacuum-tube machines?',choices:['Transistors','Bigger keyboards','More paper storage'],correct:0,why:'Transistors replaced many vacuum tubes and enabled smaller, more reliable electronic circuits.',challenge:'Why does a timeline show broad eras rather than one exact date for every computer?',control:'Computing era',options:['Mechanical','Vacuum tubes','Transistors','Integrated circuits','Microprocessors'],compute:v=>({label:v,detail:({Mechanical:'Mechanical devices performed calculations through moving parts.', 'Vacuum tubes':'Electronic switching worked but required substantial space and power.',Transistors:'Semiconductor switches greatly reduced size and power use.','Integrated circuits':'Many electronic components were placed on one chip.',Microprocessors:'A processor on a chip helped make personal and mobile computing practical.'})[v],view:`Development: Mechanical → Tubes → Transistors → ICs → Microprocessors`})},
 {question:'If you change a heading style, what happens to all headings using that style?',choices:['They update together','Only the first heading changes','The document deletes its images'],correct:0,why:'Styles define reusable formatting. Changing one style can update every paragraph that uses it.',challenge:'When would applying a style be more useful than making one word bold?',control:'Heading size',min:18,max:38,start:25,unit:'px',compute:v=>({label:`Heading style: ${v}px`,detail:'Both sample headings use the same style. Moving the control updates both consistently.',view:`<span style="font-size:${v}px">Section A</span> &nbsp; <span style="font-size:${v}px">Section B</span>`})},
 {question:'Which slide is usually easier to explain from the back of a classroom?',choices:['One main idea and a clear visual','Ten small paragraphs','Tiny text in every corner'],correct:0,why:'A clear main idea and readable visual help the audience follow the speaker.',challenge:'How would you split a crowded slide without losing its key message?',control:'Lines on slide',min:1,max:10,start:4,unit:'lines',compute:v=>({label:v<=4?'Easy to scan':v<=7?'Getting crowded':'Very dense',detail:`This simplified slide has ${v} text lines. Readability also depends on font size, contrast and the room.`,view:'▰ '.repeat(v)})},
 {question:'If the value in A1 changes, what should happen to a formula =A1+B1?',choices:['It recalculates','The formula turns into plain text','B1 disappears'],correct:0,why:'A spreadsheet formula refers to cells and recalculates when the referenced values change.',challenge:'What would =A1+B1 show when A1 is 7 and B1 is 5?',control:'A1 value (B1 = 5)',min:0,max:20,start:7,unit:'',compute:v=>({label:`C1 = ${v+5}`,detail:`A1 = ${v}; B1 = 5; C1 contains =A1+B1, so ${v}+5=${v+5}.`,view:`A1 [${v}]  +  B1 [5]  →  C1 [${v+5}]`})},
 {question:'What must a browser usually learn before it can contact a website by domain name?',choices:['Its IP address from DNS','The screen brightness','The CPU temperature'],correct:0,why:'DNS helps resolve a domain name to an IP address. The browser can then contact a server; HTTPS adds encrypted transport.',challenge:'Why does HTTPS protect message contents but not mean every website is trustworthy?',control:'Connection step',options:['DNS lookup','Connect to server','HTTPS/TLS','Response'],compute:v=>({label:v,detail:({'DNS lookup':'The browser asks a resolver for the address associated with a domain.','Connect to server':'Packets travel through networks to the server address.','HTTPS/TLS':'The browser and server establish an encrypted connection when using HTTPS.','Response':'The server sends data; the browser interprets and displays it.'})[v],view:'Browser → DNS → Network → Server → Browser'})},
 {question:'For an AND gate, what is the output when A = 1 and B = 0?',choices:['0','1','2'],correct:0,why:'AND outputs 1 only when both inputs are 1.',challenge:'Which gate outputs 1 when exactly one input is 1?',control:'Logic gate',options:['AND','OR','XOR'],compute:v=>({label:`${v} truth table`,detail:({'AND':'AND needs both inputs to be 1.','OR':'OR needs at least one input to be 1.','XOR':'XOR needs exactly one input to be 1.'})[v],view:[0,1].flatMap(a=>[0,1].map(b=>`${a} ${v} ${b} = ${v==='AND'?(a&b):v==='OR'?(a|b):(a^b)}`)).join('  |  ')})},
 {question:'If a router fails, can two PCs connected to the same working switch still communicate locally?',choices:['Yes, if their local links work','No, all local links vanish','Only if a printer is on'],correct:0,why:'The switch can still forward local traffic. The failed router prevents traffic between that LAN and other networks.',challenge:'What changes if the central switch fails instead of the router?',control:'Device to disconnect',options:['None','Router','Switch','One PC link'],compute:v=>({label:v==='None'?'All paths available':`${v} disconnected`,detail:({'None':'Local PCs and Internet paths are available in this simplified topology.','Router':'The PCs can still talk through the switch, but cannot reach the Internet through this router.','Switch':'The PCs lose their shared local connection through the switch.','One PC link':'One PC loses this link; the other PC can still reach the router.'})[v],view:networkView(v)})},
 {question:'Can a program run successfully and still give the wrong answer?',choices:['Yes, from a logic error','No, running proves correctness','Only when offline'],correct:0,why:'A logic error can produce an incorrect result even when the syntax is valid and the program runs.',challenge:'Which test input would expose an area formula that adds width and height?',control:'Code example',options:['Correct: area = w * h','Syntax: area = w *','Logic: area = w + h'],compute:v=>({label:v.startsWith('Correct')?'Runs and calculates area':v.startsWith('Syntax')?'Parsing stops':'Runs, but result is wrong',detail:v.startsWith('Correct')?'For w=3 and h=4, the result is 12.':v.startsWith('Syntax')?'An incomplete expression cannot be parsed as this program.':'For w=3 and h=4, this returns 7 rather than the correct area 12.',view:'Source → Parse → Check → Execute → Test'})},
 {question:'If a model trains only on red apples, is its prediction about a green apple dependable?',choices:['Not necessarily; training data is limited','Always, because it has seen apples','The colour cannot affect a model'],correct:0,why:'A narrow training set can teach misleading patterns. Test on varied examples to see whether the model generalizes.',challenge:'What new examples would you add to reduce colour bias in this fruit classifier?',control:'Green apples in training set',min:0,max:6,start:0,unit:'examples',compute:v=>({label:v===0?'Green apple may be misclassified':'Model has diverse apple examples',detail:v===0?'This toy nearest-colour classifier saw only red apples and orange oranges; it may associate green with the wrong class.':`Adding ${v} green apple example${v===1?'':'s'} gives it evidence that apples can also be green. Real models require much broader testing.`,view:`Training: red apples × 6  •  green apples × ${v}  •  oranges × 6`})}

const activityAnswers={};
const activityValues={};
function renderActivity(index){const a=ACTIVITIES[index],box=document.getElementById('activity');if(!box)return;const answer=activityAnswers[index];box.innerHTML=`<h2>🧪 Predict → Try → Explain</h2><p class="activity-prompt"><b>Predict:</b> ${a.question}</p><div class="activity-choices">${a.choices.map((v,n)=>`<button type="button" class="activity-choice${answer===n?' picked':''}" onclick="predictActivity(${index},${n})">${v}</button>`).join('')}</div><div id="activity-feedback" class="activity-feedback" aria-live="polite"></div><div id="activity-try" class="activity-try" ${answer===undefined?'hidden':''}><h3>Try it</h3><label for="activity-input">${a.control}</label><div id="activity-control"></div><div id="activity-result" class="activity-result" aria-live="polite"></div><p><b>Explain:</b> ${a.why}</p><p><b>Apply it:</b> ${a.challenge}</p></div>`;if(answer!==undefined){showActivityFeedback(index,answer);setupActivityControl(index)}}
function predictActivity(index,choice){activityAnswers[index]=choice;renderActivity(index);window.notifyActivityChange?.(index)}
function showActivityFeedback(index,choice){const a=ACTIVITIES[index],f=document.getElementById('activity-feedback');f.className='activity-feedback '+(choice===a.correct?'correct':'retry');f.textContent=(choice===a.correct?'✅ Good prediction. ':'💡 Reconsider the idea. ')+a.why}
function setupActivityControl(index){const a=ACTIVITIES[index],c=document.getElementById('activity-control');if(a.options){const select=document.createElement('select');select.id='activity-input';for(const option of a.options){const item=document.createElement('option');item.value=option;item.textContent=option;select.appendChild(item)}c.appendChild(select);select.value=activityValues[index]??a.options[0];select.addEventListener('change',()=>updateActivity(index,select.value));updateActivity(index,activityValues[index]??a.options[0])}else{const slider=document.createElement('input');slider.id='activity-input';slider.type='range';slider.min=a.min;slider.max=a.max;slider.value=a.start;c.appendChild(slider);slider.value=activityValues[index]??a.start;slider.addEventListener('input',()=>updateActivity(index,Number(slider.value)));updateActivity(index,activityValues[index]??a.start)}}
function updateActivity(index,value){activityValues[index]=value;window.notifyActivityChange?.(index);const result=ACTIVITIES[index].compute(value),box=document.getElementById('activity-result');box.innerHTML=`<strong>${result.label}</strong><div class="activity-model"></div><p></p>`;box.querySelector('.activity-model').innerHTML=result.view;box.querySelector('p').textContent=result.detail}

function applyRemoteActivity(index,answer,value){if(!Number.isInteger(index)||index<0||index>=ACTIVITIES.length)return;if(Number.isInteger(answer)&&answer>=0&&answer<ACTIVITIES[index].choices.length)activityAnswers[index]=answer;else delete activityAnswers[index];if(value!==undefined){const a=ACTIVITIES[index];if(a.options&&a.options.includes(value))activityValues[index]=value;else if(!a.options&&Number.isFinite(value))activityValues[index]=Math.max(a.min,Math.min(a.max,value))}renderActivity(index);const ctl=document.getElementById('activity-input');if(ctl&&activityValues[index]!==undefined){ctl.value=activityValues[index];updateActivity(index,activityValues[index])}}

</script><script>const EXAMPLES=["A student types an answer, the CPU processes the keystrokes, RAM holds the active document, and the screen shows the result.", "A timeline from mechanical calculators to transistors, integrated circuits and microprocessors shows how computing became smaller and more capable.", "A school report can use heading styles, a table, an image, page numbers and a PDF export.", "A science presentation can use one slide for the question, one for a diagram, one for results and one for the conclusion.", "A class marks sheet can calculate totals and averages and then display the results in a chart.", "When a student enters a web address, the browser can use DNS, send packets through routers and receive a response from a web server.", "The binary number 1101 is 8+4+0+1, so its decimal value is 13.", "In a school lab, PCs can connect to a switch, the switch to a router, and the router to the ISP and wider Internet.", "A compiler can transform source code through parsing, analysis, optimization and code generation before executable instructions are produced.", "A model can learn from labeled examples of messages and then classify a new message as likely spam or not spam."];const QUIZ=[[["Which component executes instructions?", ["CPU", "SSD", "Monitor", "Keyboard"], 0], ["Which is normally volatile working memory?", ["SSD", "RAM", "DVD", "Printer"], 1]], [["What technology replaced many vacuum-tube applications?", ["Transistors", "Printers", "Monitors", "Keyboards"], 0], ["What put CPU functions onto a chip?", ["Microprocessor", "Router", "Spreadsheet", "Printer"], 0]], [["What helps keep headings consistent?", ["Styles", "Router", "Compiler", "RAM"], 0], ["What organizes information in rows and columns?", ["Table", "CPU", "Browser", "DNS"], 0]], [["What is useful for numerical patterns?", ["Chart", "Keyboard", "Folder", "Router"], 0], ["What should a slide usually make clear?", ["A main idea", "Every textbook sentence", "Only decoration", "Random facts"], 0]], [["Which is a spreadsheet function?", ["SUM", "HTTP", "DNS", "HTML"], 0], ["What is B4?", ["A cell reference", "A web address", "A file type", "A compiler"], 0]], [["What does DNS help a client find?", ["An IP address for a domain", "A CPU clock", "A printer driver", "A spreadsheet formula"], 0], ["Which protocol protects web communication with TLS?", ["HTTPS", "RAM", "BIOS", "HTML"], 0]], [["How many symbols does binary use?", ["2", "8", "10", "16"], 0], ["What is binary 1101 in decimal?", ["13", "11", "15", "9"], 0]], [["What device commonly connects devices within a LAN?", ["Switch", "Printer", "Scanner", "Projector"], 0], ["What connects different networks?", ["Router", "Keyboard", "Monitor", "Spreadsheet"], 0]], [["Which compiler stage checks program structure?", ["Parsing", "Printing", "Routing", "Formatting"], 0], ["Can a program compile and still contain a logic error?", ["Yes", "No", "Only on phones", "Only online"], 0]], [["What strongly influences what a model learns?", ["Training data", "Monitor size", "Keyboard layout", "Printer speed"], 0], ["What is overfitting?", ["Fitting training data too closely", "Deleting all data", "Increasing screen size", "Changing a keyboard"], 0]]];const L=[{"title":"1. Computer Characteristics & Components","overview":"Computers accept input, process information, produce output and store data. Hardware is the physical equipment; software is the instructions and data that make the equipment useful.","facts":["CPU executes instructions and coordinates many operations.","RAM is temporary working memory; storage keeps data when power is removed.","Input, process, output and storage form a useful introductory model for understanding computer systems.","A computer can be viewed as a combination of hardware, software, data and people working together.","The same CPU can be used in many different kinds of devices because software and connected hardware change its role."],"sections":[["Core idea","A computer is a programmable electronic system. It can perform arithmetic, logical operations, comparisons, data movement and communication according to instructions."],["IPOS cycle","Input supplies data through keyboards, cameras, microphones, sensors and touchscreens. Processing transforms data. Output communicates results through screens, speakers, printers or actuators. Storage retains information."],["CPU, RAM and storage","The CPU executes instructions. RAM provides fast working space for active programs. SSDs and hard drives provide persistent storage. They have different purposes and should not be described as interchangeable."],["Motherboard and buses","The motherboard provides physical and electrical connections between major components. Buses and interfaces provide pathways for data and control signals."],["GPU","A graphics processing unit is designed for highly parallel operations and is widely used for graphics, visualization and some general-purpose workloads."],["Input/output devices","Keyboard, mouse, camera, microphone and sensors are common input devices. Display, speakers and printers are common output devices. Touchscreens can perform both roles."],["Hardware vs software","Hardware can be physically touched. Software includes operating systems, applications, drivers and other instructions. Hardware needs software to perform useful tasks."],["Computer characteristics","Speed, accuracy, automation, storage, consistency, versatility and connectivity are common characteristics. These are strengths only when the system is correctly designed and supplied with suitable data."],["Classroom activity","Ask students to trace a school attendance system through input, processing, output and storage. Then ask them to identify which parts are hardware and which are software."]],"key":"The CPU is the processor, RAM is working memory, and storage keeps information for later use.","image1":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgM e abacus is an early structured calculation aid.","Transistors replaced vacuum tubes in many systems because they were smaller, more reliable and more efficient.","The microprocessor placed CPU functionality on a chip and helped enable widespread personal computing.","Computer generations overlap; older technologies can continue to be used after newer technologies appear.","Modern devices combine ideas from several historical advances rather than belonging to only one 'generation'."],"sections":[["Early tools","Tally marks, counting boards and the abacus provided ways to represent quantities and support calculation."],["Mechanical calculators","Gear-based machines automated arithmetic. They helped demonstrate that mechanical systems could carry out repeatable calculations."],["Babbage and Lovelace","Charles Babbage proposed programmable mechanical machines. Ada Lovelace's notes on the Analytical Engine included an algorithm and are historically significant."],["Vacuum tubes","Early electronic computers used vacuum tubes for switching and amplification. They were large and produced substantial heat."],["Transistors","Transistors provided smaller and generally more reliable electronic switching, enabling more compact systems."],["Integrated circuits","Integrated circuits put multiple electronic components onto chips, improving size, reliability and manufacturing efficiency."],["Microprocessors","A microprocessor integrates CPU functions onto a chip. This was a major step toward affordable personal computers and embedded systems."],["Personal computers","Personal computers brought interactive computing into homes, schools and offices. Graphical interfaces and peripherals improved usability."],["Internet, web and mobile","Networking connected systems. The web made linked information accessible through browsers. Smartphones combined computing, communication, cameras, sensors and applications."],["Classroom timeline","Give groups technology cards and ask them to arrange a timeline. Emphasize that technologies overlapped rather than replacing each other overnight."]],"key":"Modern computing is the result of many incremental improvements in components, software, networking, manufacturing and usability.","image1":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgNDUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkNvbXB1dGluZyB0aW1lbGluZSBkaWFncmFtIj48cmVjdCB3aWR0aD0iODAwIiBoZWlnaHQ9IjQ1MCIgcng9IjI0IiBmaWxsPSIjMDkxODI5Ii8+PHRleHQgeD0iNDAiIHk9IjU4IiBmaWxsPSIjZThmNWZmIiBmb250LXNpemU9IjI5IiBmb250LWZhbWlseT0ic3lzdGVtLXVpIiBmb250LXdlaWdodD0iYm9sZCI+Q29tcHV0aW5nIHRpbWVsaW5lIOKAlCBob3cgaXQgd29ya3M8L3RleHQ+PHJlY3QgeD0iMzUuMCIgeT0iMTQ1IiB3aWR0aD0iMTcwLjUiIGhlaWdodD0iMTU1IiByeD0iMTgiIGZpbGw9IiMxMzJhNDIiIHN0cm9rZT0iIzM5YmRmOCIgc3Ryb2tlLXdpZHRoPSIzIi8+PHRleHQgeD0iMTIwLjIiIHk9IjIxNyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWkiIGZvbnQtd2VpZ2h0PSJib2xkIiBmb250LXNpemU9IjIyIj5NZWNoYW5pY2FsPC90ZXh0Pjx0ZXh0IHg9IjIxMy41IiB5PSIyMzUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiNmYmJmMjQiIGZvbnQtc2l6ZT0iMjYiPuKGkjwvdGV4dD48cmVjdCB4PSIyMjEuNSIgeT0iMTQ1IiB3aWR0aD0iMTcwLjUiIGhlaWdodD0iMTU1IiByeD0iMTgiIGZpbGw9IiMxMzJhNDIiIHN0cm9rZT0iIzM5YmRmOCIgc3Ryb2tlLXdpZHRoPSIzIi8+PHRleHQgeD0iMzA2LjgiIHk9IjIxNyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWkiIGZvbnQtd2VpZ2h0PSJib2xkIiBmb250LXNpemU9IjIzIj5WYWN1dW08L3RleHQ+PHRleHQgeD0iMzA2LjgiIHk9IjI1MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2M4ZGVmMCIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC1zaXplPSIxOCI+dHViZXM8L3RleHQ+PHRleHQgeD0iNDAwLjAiIHk9IjIzNSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZiYmYyNCIgZm9udC1zaXplPSIyNiI+4oaSPC90ZXh0PjxyZWN0IHg9IjQwOC4wIiB5PSIxNDUiIHdpZHRoPSIxNzAuNSIgaGVpZ2h0PSIxNTUiIHJ4PSIxOCIgZmlsbD0iIzEzMmE0MiIgc3Ryb2tlPSIjMzliZGY4IiBzdHJva2Utd2lkdGg9IjMiLz48dGV4dCB4PSI0OTMuMiIgeT0iMjE3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiIGZvbnQtc2l6ZT0iMjAiPlRyYW5zaXN0b ning, facts, formatting and source attribution. Automated checking cannot detect every problem."],["Responsible use","Students should respect copyright, cite sources when required and distinguish their own work from copied material."],["Classroom activity","Give students a plain page and ask them to turn it into a structured assignment with a title, headings, bullets, table and page number."]],"key":"A professional document is organized, readable, accurate and easy to navigate.","image1":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgNDUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IldvcmQgcHJvY2Vzc2luZyBkaWFncmFtIj48cmVjdCB3aWR0aD0iODAwIiBoZWlnaHQ9IjQ1MCIgcng9IjI0IiBmaWxsPSIjMDkxODI5Ii8+PHRleHQgeD0iNDAiIHk9IjU4IiBmaWxsPSIjZThmNWZmIiBmb250LXNpemU9IjI5IiBmb250LWZhbWlseT0ic3lzdGVtLXVpIiBmb250LXdlaWdodD0iYm9sZCI+V29yZCBwcm9jZXNzaW5nIOKAlCBob3cgaXQgd29ya3M8L3RleHQ+PHJlY3QgeD0iMzUuMCIgeT0iMTQ1IiB3aWR0aD0iMTcwLjUiIGhlaWdodD0iMTU1IiByeD0iMTgiIGZpbGw9IiMxMzJhNDIiIHN0cm9rZT0iIzM5YmRmOCIgc3Ryb2tlLXdpZHRoPSIzIi8+PHRleHQgeD0iMTIwLjIiIHk9IjIxNyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWkiIGZvbnQtd2VpZ2h0PSJib2xkIiBmb250LXNpemU9IjIzIj5EcmFmdDwvdGV4dD48dGV4dCB4PSIyMTMuNSIgeT0iMjM1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmJiZjI0IiBmb250LXNpemU9IjI2Ij7ihpI8L3RleHQ+PHJlY3QgeD0iMjIxLjUiIHk9IjE0NSIgd2lkdGg9IjE3MC41IiBoZWlnaHQ9IjE1NSIgcng9IjE4IiBmaWxsPSIjMTMyYTQyIiBzdHJva2U9IiMzOWJkZjgiIHN0cm9rZS13aWR0aD0iMyIvPjx0ZXh0IHg9IjMwNi44IiB5PSIyMTciIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IndoaXRlIiBmb250LWZhbWlseT0ic3lzdGVtLXVpIiBmb250LXdlaWdodD0iYm9sZCIgZm9udC1zaXplPSIyMyI+U3R5bGU8L3RleHQ+PHRleHQgeD0iNDAwLjAiIHk9IjIzNSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZiYmYyNCIgZm9udC1zaXplPSIyNiI+4oaSPC90ZXh0PjxyZWN0IHg9IjQwOC4wIiB5PSIxNDUiIHdpZHRoPSIxNzAuNSIgaGVpZ2h0PSIxNTUiIHJ4PSIxOCIgZmlsbD0iIzEzMmE0MiIgc3Ryb2tlPSIjMzliZGY4IiBzdHJva2Utd2lkdGg9IjMiLz48dGV4dCB4PSI0OTMuMiIgeT0iMjE3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9u ions where appropriate and descriptions for important visual content."],["Citations","Images, statistics and quotations may require attribution depending on their source and intended use."],["Delivery","Maintain eye contact, explain rather than read, pause for questions and check whether students are following."],["Classroom activity","Turn a textbook paragraph into three slides: key idea, visual explanation and summary. Ask students whether the slides improve understanding."]],"key":"Slides are visual support for teaching, not a replacement for explanation.","image1":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgNDUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IlByZXNlbnRhdGlvbnMgZGlhZ3JhbSI+PHJlY3Qgd2lkdGg9IjgwMCIgaGVpZ2h0PSI0NTAiIHJ4PSIyNCIgZmlsbD0iIzA5MTgyOSIvPjx0ZXh0IHg9IjQwIiB5PSI1OCIgZmlsbD0iI2U4ZjVmZiIgZm9udC1zaXplPSIyOSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiPlByZXNlbnRhdGlvbnMg4oCUIGhvdyBpdCB3b3JrczwvdGV4dD48cmVjdCB4PSIzNS4wIiB5PSIxNDUiIHdpZHRoPSIyMzIuNyIgaGVpZ2h0PSIxNTUiIHJ4PSIxOCIgZmlsbD0iIzEzMmE0MiIgc3Ryb2tlPSIjMzliZGY4IiBzdHJva2Utd2lkdGg9IjMiLz48dGV4dCB4PSIxNTEuMyIgeT0iMjE3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiIGZvbnQtc2l6ZT0iMjMiPk1lc3NhZ2U8L3RleHQ+PHRleHQgeD0iMjc1LjciIHk9IjIzNSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZiYmYyNCIgZm9udC1zaXplPSIyNiI+4oaSPC90ZXh0PjxyZWN0IHg9IjI4My43IiB5PSIxNDUiIHdpZHRoPSIyMzIuNyIgaGVpZ2h0PSIxNTUiIHJ4PSIxOCIgZmlsbD0iIzEzMmE0MiIgc3Ryb2tlPSIjMzliZGY4IiBzdHJva2Utd2lkdGg9IjMiLz48dGV4dCB4PSI0MDAuMCIgeT0iMjE3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiIGZvbnQtc2l6ZT0iMjMiPlZpc3VhbDwvdGV4dD48dGV4dCB4PSI1MjQuMyIgeT0iMjM1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmJiZjI0IiBmb250LXNpemU9IjI2Ij7ihpI8L3RleHQ+PHJlY3QgeD0iNTMyLjMiIHk9IjE0NSIgd2lkdGg9IjIzMi43IiBoZWlnaHQ9IjE1NSIgcng9IjE4IiBmaWxsPSIjMTMyYTQyIiBzdHJva2U9IiMzOWJkZjgiIHN0cm9rZS13aWR0aD0iMyIvPj . Compare with manual calculations when practical."],["Classroom activity","Build a marks sheet, calculate totals and averages, then create a chart. Change one mark and observe which results update."]],"key":"Cells, references and formulas turn a table of values into a dynamic calculation system.","image1":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgNDUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IlNwcmVhZHNoZWV0cyBkaWFncmFtIj48cmVjdCB3aWR0aD0iODAwIiBoZWlnaHQ9IjQ1MCIgcng9IjI0IiBmaWxsPSIjMDkxODI5Ii8+PHRleHQgeD0iNDAiIHk9IjU4IiBmaWxsPSIjZThmNWZmIiBmb250LXNpemU9IjI5IiBmb250LWZhbWlseT0ic3lzdGVtLXVpIiBmb250LXdlaWdodD0iYm9sZCI+U3ByZWFkc2hlZXRzIOKAlCBob3cgaXQgd29ya3M8L3RleHQ+PHJlY3QgeD0iMzUuMCIgeT0iMTQ1IiB3aWR0aD0iMjMyLjciIGhlaWdodD0iMTU1IiByeD0iMTgiIGZpbGw9IiMxMzJhNDIiIHN0cm9rZT0iIzM5YmRmOCIgc3Ryb2tlLXdpZHRoPSIzIi8+PHRleHQgeD0iMTUxLjMiIHk9IjIxNyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWkiIGZvbnQtd2VpZ2h0PSJib2xkIiBmb250LXNpemU9IjIzIj5EYXRhPC90ZXh0Pjx0ZXh0IHg9IjE1MS4zIiB5PSIyNTAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiNjOGRlZjAiIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWkiIGZvbnQtc2l6ZT0iMTgiPmNlbGxzPC90ZXh0Pjx0ZXh0IHg9IjI3NS43IiB5PSIyMzUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiNmYmJmMjQiIGZvbnQtc2l6ZT0iMjYiPuKGkjwvdGV4dD48cmVjdCB4PSIyODMuNyIgeT0iMTQ1IiB3aWR0aD0iMjMyLjciIGhlaWdodD0iMTU1IiByeD0iMTgiIGZpbGw9IiMxMzJhNDIiIHN0cm9rZT0iIzM5YmRmOCIgc3Ryb2tlLXdpZHRoPSIzIi8+PHRleHQgeD0iNDAwLjAiIHk9IjIxNyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0id2hpdGUiIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWkiIGZvbnQtd2VpZ2h0PSJib2xkIiBmb250LXNpemU9IjIzIj5Gb3JtdWxhczwvdGV4dD48dGV4dCB4PSI1MjQuMyIgeT0iMjM1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmJiZjI0IiBmb250LXNpemU9IjI2Ij7ihpI8L3RleHQ+PHJlY3QgeD0iNTMyLjMiIHk9IjE0NSIgd2lkdGg9IjIzMi43IiBoZWlnaHQ9IjE1NSIgcng9IjE4IiBmaWxsPSIjMTMyYTQyIiBzdHJva2U9IiMzOWJkZjgiIHN0cm9rZS13aWR0aD0iMyIvPjx0ZXh0IHg9IjY0OC43IiB5PSIyMTciIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IndoaXRlIiBmb250LWZhbWlseT0ic3lzdGVtLXVpIiBmb250LXdlaWdod rvers, networks and web technologies to exchange documents and data. HTML provides structure, CSS presentation, and JavaScript behavior.","facts":["A browser is a common web client.","HTTPS uses HTTP over a secure encrypted connection using TLS.","A single webpage can trigger many requests for scripts, images, fonts, styles and data.","The Internet can carry services other than the Web, including email, streaming and file transfer.","A webpage may require many separate network requests for HTML, stylesheets, scripts, images and data."],"sections":[["Client and server","A client requests a service. A server receives requests and returns resources or generated responses."],["URL and domain","A URL identifies a resource. Domain names provide human-friendly names that can be resolved to network addresses."],["HTTP and HTTPS","HTTP defines web message exchange. HTTPS adds encrypted transport through TLS. Encryption does not automatically mean that a site is trustworthy."],["HTML, CSS and JavaScript","HTML structures content, CSS controls presentation, and JavaScript adds behavior and interactivity."],["Request and response","A browser can request HTML and then additional resources. Responses contain status information and content."],["DNS","The Domain Name System resolves domain names to network addresses and may use cached results."],["Cookies and sessions","Cookies can store preferences or session identifiers. Their use has privacy and security implications."],["Web security","Secure authentication, input validation, access control and safe data handling are important. Students should only test systems they are authorized to test."],["Local web apps","A local server can serve an HTML project over HTTP, avoiding some restrictions associated with directly opening local files."],["Classroom analogy","Compare a web interaction with a restaurant: browser = customer, request = order, server = kitchen, response = completed order."]],"key":"HTML, CSS and JavaScript are core we 9vbSBleGFtcGxlLjwvdGV4dD48L3N2Zz4="},{"title":"7. Binary Logic & Number System","overview":"Binary is the base-2 number system. Computers use bits with two states, commonly represented as 0 and 1, to represent digital information.","facts":["One byte is commonly eight bits.","Eight bits can form 256 different patterns.","Binary 101 is decimal 5 because 1×4 + 0×2 + 1×1 = 5.","Hexadecimal is often used because it gives a compact way to write binary patterns.","With n bits there are 2^n possible combinations, so adding one bit doubles the number of possible patterns."],"sections":[["Bits and bytes","A bit has two possible states. Eight bits make a byte. With n bits, there are 2^n possible patterns."],["Place values","Binary places represent powers of two: 1, 2, 4, 8, 16, 32 and so on."],["Binary to decimal","Multiply each bit by its place value and add the results."],["Decimal to binary","Select powers of two that add to the target number or repeatedly divide by two."],["Logic gates","AND, OR and NOT are foundational gates. NAND and NOR are also important in digital logic."],["Data representation","Binary patterns can represent numbers, characters, colors, instructions and many other forms depending on the encoding."],["Signed values","Systems use methods such as two's complement to represent negative integers."],["Overflow","A fixed number of bits limits the range of values. Values outside the range can overflow or be represented differently."],["Interactive teaching","Use physical cards labeled 128, 64, 32, 16, 8, 4, 2 and 1. Face up means 1 and face down means 0."],["Classroom challenge","Ask students to build a target number using the fewest cards and then explain their method."]],"key":"Each binary position represents a power of two; students can learn it effectively with physical switches or cards.","image1":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgNDUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkJpbmFyeSBsb2dpYy y can exchange information. Topology describes how connections are arranged physically or logically.","facts":["Star networks commonly use a central switch.","Mesh topologies provide multiple paths but require more links.","Real networks often combine several topology ideas rather than using one pure form.","The Internet is a network of networks rather than one single physical network owned by one organization.","A router can forward packets between different networks, while a switch commonly connects devices within a local network."],"sections":[["Network devices","Common devices include switches, routers, wireless access points, endpoints and servers."],["Star","Endpoints connect to a central switch or device. A single endpoint link can fail without necessarily stopping other endpoints."],["Bus","Devices share a common communication path. It is useful historically for teaching topology."],["Ring","Devices form a loop. Protocols determine how data moves around the ring."],["Mesh","Multiple connections create alternate paths. Full mesh connects every pair, while partial mesh connects selected devices."],["Tree","Hierarchical branches form a tree-like arrangement."],["Switch vs router","A switch connects devices within a network and forwards frames. A router connects different networks and forwards packets between them."],["Performance","Design considers bandwidth, latency, reliability, scalability, cost and security."],["Fault tolerance","Redundant paths can improve resilience but add cost and management complexity."],["Classroom activity","Use string or cables to build star, ring and mesh arrangements, then remove one link and discuss the effect."]],"key":"Topology is about arrangement and connection. Good design balances cost, performance, reliability and security.","image1":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgNDUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkNvbXB1dGVyIG5ldHdvcmtzIGRpYWdyYW0iPjxyZWN0IHdpZHRoP zc3Jvb20gZXhhbXBsZS48L3RleHQ+PC9zdmc+"},{"title":"9. Programming Languages & Compilers","overview":"Programming languages allow humans to express algorithms. Translators such as compilers and interpreters convert or execute those instructions in forms the computer can use.","facts":["An algorithm is a solution method; source code is an implementation of that method.","Syntax errors violate grammar; logic errors can occur even when a program runs.","Compilers can perform stages such as parsing, semantic analysis, optimization and code generation.","A program can compile successfully and still contain a logic error that produces the wrong result.","Debugging is a systematic process of finding the cause of incorrect behavior, not simply guessing and changing code."],"sections":[["Algorithms","Start with the problem and solution steps before focusing on language syntax."],["Language levels","Machine code is directly executable by a processor. Assembly uses symbolic instructions. High-level languages provide more abstraction."],["Compiler","A compiler translates source code into another representation, often including machine code, object code or intermediate code."],["Interpreter","An interpreter evaluates or executes program representations at runtime. Modern systems may combine compilation and interpretation."],["Syntax","Syntax defines the grammar of a programming language."],["Semantics","Semantics concerns what valid code means and how it behaves."],["Build process","Depending on the language, a build may involve preprocessing, compilation, assembly, linking and packaging."],["Errors","Syntax errors stop or disrupt translation. Runtime errors occur during execution. Logic errors produce incorrect results."],["Testing and debugging","Reproduce the issue, isolate the cause, make a small change, test again and document the result."],["Classroom activity","Write the algorithm for rectangle area in plain language, pseudocode and a programming language. Compare the algorithm with the syntax."]],"key":"Good programming begins with problem solving, then expresses the solution using a language and suitable tools.","image1":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgNDUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IlByb2dyYW1taW5nIGFuZCBjb21waWxlcnMgZGlhZ3JhbSI+PHJlY3Qgd2lkdGg9IjgwMCIgaGVpZ2h0PSI0NTAiIHJ4PSIyNCIgZmlsbD0iIzA5MTgyOSIvPjx0ZXh0IHg9IjQwIiB5PSI1OCIgZmlsbD0iI2U4ZjVmZiIgZm9udC1zaXplPSIyOSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiPlByb2dyYW1taW5nIGFuZCBjb21waWxlcnMg4oCUIGhvdyBpdCB3b3JrczwvdGV4dD48cmVjdCB4PSIzNS4wIiB5PSIxNDUiIHdpZHRoPSIxNzAuNSIgaGVpZ2h0PSIxNTUiIHJ4PSIxOCIgZmlsbD0iIzEzMmE0MiIgc3Ryb2tlPSIjMzliZGY4IiBzdHJva2Utd2lkdGg9IjMiLz48dGV4dCB4PSIxMjAuMiIgeT0iMjE3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiIGZvbnQtc2l6ZT0iMjMiPlNvdXJjZTwvdGV4dD48dGV4dCB4PSIyMTMuNSIgeT0iMjM1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmJiZjI0IiBmb250LXNpemU9IjI2Ij7ihpI8L3RleHQ+PHJlY3QgeD0iMjIxLjUiIHk9IjE0NSIgd2lkdGg9IjE3MC41IiBoZWlnaHQ9IjE1NSIgcng9IjE4IiBmaWxsPSIjMTMyYTQyIiBzdHJva2U9IiMzOWJkZjgiIHN0cm9rZS13aWR0aD0iMyIvPjx0ZXh0IHg9IjMwNi44IiB5PSIyMTciIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IndoaXRlIiBmb250LWZhbWlseT0ic3lzdGVtLXVpIiBmb250LXdlaWdodD0iYm9sZCIgZm9udC1zaXplPSIyMyI+UGFyc2U8L3RleHQ+PHRleHQgeD0iNDAwLjAiIHk9IjIzNSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZiYmYyNCIgZm9udC1zaXplPSIyNiI+4oaSPC90ZXh0PjxyZWN0IHg9IjQwOC4wIiB5PSIxNDUiIHdpZHRoPSIxNzAuNSIgaGVpZ2h0PSIxNTUiIHJ4PSIxOCIgZmlsbD0iIzEzMmE0MiIgc3Ryb2tlPSIjMzliZGY4IiBzdHJva2Utd2lkdGg9IjMiLz48dGV4dCB4PSI0OTMuMiIgeT0iMjE3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiIGZvbnQtc2l6ZT0iMjMiPkFuYWx5emU8L3RleHQ+PHRleHQgeD0iNTg2LjUiIHk9IjIzNSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZiYmYyNCIgZm9udC1zaXplPSIyNiI+4oaSPC90ZXh0PjxyZWN0IHg9IjU5NC41IiB5PSIxNDUiIHdpZHRoPSIxNzAuNSIgaGVpZ2h0PSIxNTUiIHJ4PSIxOCIgZmlsbD0iIzEzMmE0MiIgc3Ryb2tl arning uses many layers."],["Overfitting","A model may memorize training patterns or noise instead of learning general patterns."],["Evaluation","Depending on the problem, useful measures include precision, recall, F1 score, accuracy, mean absolute error and mean squared error."],["Responsible AI","Bias, privacy, errors, security and unequal impacts need careful consideration. Human oversight remains important."],["Classroom activity","Use a small labeled dataset such as fruit properties. Ask students to classify a new example and discuss why diverse training data matters."]],"key":"Machine learning finds patterns in data; training quality, evaluation and responsible use are essential.","image1":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgNDUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9Ik1hY2hpbmUgbGVhcm5pbmcgZGlhZ3JhbSI+PHJlY3Qgd2lkdGg9IjgwMCIgaGVpZ2h0PSI0NTAiIHJ4PSIyNCIgZmlsbD0iIzA5MTgyOSIvPjx0ZXh0IHg9IjQwIiB5PSI1OCIgZmlsbD0iI2U4ZjVmZiIgZm9udC1zaXplPSIyOSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiPk1hY2hpbmUgbGVhcm5pbmcg4oCUIGhvdyBpdCB3b3JrczwvdGV4dD48cmVjdCB4PSIzNS4wIiB5PSIxNDUiIHdpZHRoPSIyMzIuNyIgaGVpZ2h0PSIxNTUiIHJ4PSIxOCIgZmlsbD0iIzEzMmE0MiIgc3Ryb2tlPSIjMzliZGY4IiBzdHJva2Utd2lkdGg9IjMiLz48dGV4dCB4PSIxNTEuMyIgeT0iMjE3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiIGZvbnQtc2l6ZT0iMjMiPlRyYWluaW5nPC90ZXh0Pjx0ZXh0IHg9IjE1MS4zIiB5PSIyNTAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiNjOGRlZjAiIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWkiIGZvbnQtc2l6ZT0iMTgiPmRhdGE8L3RleHQ+PHRleHQgeD0iMjc1LjciIHk9IjIzNSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZiYmYyNCIgZm9udC1zaXplPSIyNiI+4oaSPC90ZXh0PjxyZWN0IHg9IjI4My43IiB5PSIxNDUiIHdpZHRoPSIyMzIuNyIgaGVpZ2h0PSIxNTUiIHJ4PSIxOCIgZmlsbD0iIzEzMmE0MiIgc3Ryb2tlPSIjMzliZGY4IiBzdHJva2Utd2lkdGg9IjMiLz48dGV4dCB4PSI0MDAuMCIgeT0iMjE3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSIgZm9udC13ZWlnaHQ9ImJvbGQiIGZvbnQtc2l6 const QUIZ_EXPLANATIONS=[["The CPU executes program instructions; storage and displays have different roles.", "RAM holds active data temporarily and usually loses its contents when power is removed."], ["Transistors replaced many vacuum tubes as smaller, more reliable switches.", "A microprocessor puts processor functions on an integrated circuit."], ["Styles keep repeated headings consistent across a document.", "A table groups related information into rows and columns."], ["A chart helps reveal numerical comparisons and patterns.", "A slide is clearer when its audience can identify one main idea."], ["SUM adds values in a spreadsheet range.", "B4 names the cell in column B, row 4."], ["DNS maps a domain name to an address a device can use.", "HTTPS uses TLS to encrypt communication between browser and server."], ["Binary uses two symbols: 0 and 1.", "1101 in binary equals 8 + 4 + 0 + 1 = 13."], ["A switch connects devices inside a local network.", "A router forwards traffic between separate networks."], ["Parsing checks source structure against a language grammar.", "A logic error can give the wrong result even when a program compiles."], ["Training examples contain patterns from which a model learns.", "Overfitting means fitting the training data too closely and performing poorly on new examples."]];
function renderQuiz(idx){const box=document.getElementById("quizBox");if(!box)return;box.innerHTML=QUIZ[idx].map((q,n)=>`<div class="quizq"><b>${n+1}. ${q[0]}</b><div>${q[1].map((a,k)=>`<button onclick="answerQuiz(${idx},${n},${k},this)">${a}</button>`).join("")}</div><div id="qf${n}" class="quizfeedback"></div></div>`).join("")}
function answerQuiz(t,q,a,btn){const qd=QUIZ[t][q];btn.parentElement.querySelectorAll("button").forEach(b=>b.disabled=true);const f=document.getElementById("qf"+q);f.textContent=(a===qd[2]?"✅ Correct. ":"❌ Review this: ")+"Answer: "+qd[1][qd[2]]+". "+QUIZ_EXPLANATIONS[t][q];f.className="quizfeedback "+(a===qd[2]?"ok":"no")}
function render(i){let x=L[i];const title=document.getElementById("title"),overview=document.getElementById("overview"),sections=document.getElementById("sections"),facts=document.getElementById("facts");nav.innerHTML=L.map((q,j)=>`<button class="${j===i?"active":""}" disabled>${q.title.split(" ").slice(0,3).join(" ")}</button>`).join("");title.textContent=x.title;overview.textContent=x.overview;render3D(i);sections.innerHTML=x.sections.map(s=>`<div class=section><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");facts.innerHTML=x.facts.slice(0,3).map((f,j)=>`<div class=mini><b>Interesting fact ${j+1}</b><p>${f}</p></div>`).join("");const ex=document.getElementById("exampleText");if(ex)ex.textContent=EXAMPLES[i];renderQuiz(i);renderActivity(i);document.getElementById("visual1").src=x.image1;document.getElementById("visual2").src=x.image2;}
let connectTimer=null,connectDeadline=0;function joinRoom(){const code=document.getElementById('room').value.trim();if(!/^\d{6}$/.test(code)){alert('Enter the same six-digit classroom code as the teacher.');return}if(!window.Peer){document.getElementById('roomState').textContent='🔴 Connection library unavailable; check Internet access';return}if(peer)peer.destroy();if(connectTimer)clearTimeout(connectTimer);connectDeadline=Date.now()+90000;const state=document.getElementById('roomState');state.textContent='🟡 Connecting to classroom '+code+'…';peer=new Peer(undefined,{debug:0});peer.on('open',()=>tryConnect(code));peer.on('error',e=>{state.textContent='🔴 Connection error: '+(e.type||'unknown')});peer.on('disconnected',()=>{state.textContent='🟠 Signaling disconnected — reconnecting';try{peer.reconnect()}catch(e){}})}
function tryConnect(code){if(!peer||peer.destroyed)return;const state=document.getElementById('roomState');conn=peer.connect('cs-digital-classroom-'+code,{reliable:true});conn.on('open',()=>{state.textContent='🟢 Connected to Teacher';conn.send({type:'request'})});conn.on('data',d=>{if(d&&d.type==='activity'&&d.lesson===i){applyRemoteActivity(i,d.activityAnswer,d.activityValue);return}if(d&&Number.isInteger(d.lesson)&&d.lesson>=0&&d.lesson<L.length){i=d.lesson;render(i);applyRemoteActivity(i,d.activityAnswer,d.activityValue);window.scrollTo({top:0,behavior:'smooth'})}});conn.on('close',()=>{if(Date.now()<connectDeadline){state.textContent='🟠 Teacher disconnected — retrying';connectTimer=setTimeout(()=>tryConnect(code),2500)}else state.textContent='🔴 Connection timed out — tap Connect to retry'});conn.on('error',()=>{state.textContent='🟠 Waiting for teacher…';if(Date.now()<connectDeadline)connectTimer=setTimeout(()=>tryConnect(code),2500)});connectTimer=setTimeout(()=>{if(conn&&!conn.open&&Date.now()<connectDeadline){try{conn.close()}catch(e){};tryConnect(code)}},5000)}
function speak(){if(!('speechSynthesis' in window))return alert('Text-to-speech is not supported.');stopSpeak();let x=L[i],text=[x.title,x.overview,...x.sections.map(s=>s[0]+'. '+s[1]),'Interesting facts.',...x.facts].join(' '),u=new SpeechSynthesisUtterance(text);u.rate=.9;u.onstart=()=>document.getElementById('status').textContent='● Reading aloud';u.onend=()=>document.getElementById('status').textContent='● Ready';speechSynthesis.speak(u)}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();document.getElementById('status').textContent='● Ready'}
const roomParam=new URLSearchParams(location.search).get("room");if(/^\d{6}$/.test(roomParam||""))document.getElementById("room").value=roomParam;init3D();render(0);</script></body></html>
